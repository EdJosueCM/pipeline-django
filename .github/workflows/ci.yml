name: CI/CD Django

on:
  push:
    branches: [main, master, ci-setup]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: pipeline-django

jobs:
  # ---------------------------------------------------------------- Sesión 1
  test:
    name: CI - Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pipeline_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: pipeline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuración y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Ejecutar tests
        run: python manage.py test -v 2

  # ---------------------------------------------------------------- Sesión 3
  build:
    name: Build - Imagen Docker
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ github.sha }} .
          docker image ls $IMAGE_NAME

      - name: Exportar imagen como artefacto
        run: |
          mkdir -p dist
          docker save $IMAGE_NAME:latest | gzip > dist/$IMAGE_NAME-image.tar.gz
          cp docker-compose.deploy.yml dist/
          ls -lh dist

      - name: Guardar artefacto en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-django-image
          path: dist/
          retention-days: 7

      - name: Preparar publicación en DockerHub (simulada)
        run: |
          USUARIO="${DOCKERHUB_USERNAME:-usuario-demo}"
          docker tag $IMAGE_NAME:latest $USUARIO/$IMAGE_NAME:latest
          docker tag $IMAGE_NAME:latest $USUARIO/$IMAGE_NAME:${{ github.sha }}
          echo "Imagen etiquetada para DockerHub:"
          docker image ls $USUARIO/$IMAGE_NAME
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "SIMULACIÓN: sin secretos DOCKERHUB_*; se ejecutaría:"
            echo "  docker login -u $USUARIO"
            echo "  docker push $USUARIO/$IMAGE_NAME:latest"
            echo "  docker push $USUARIO/$IMAGE_NAME:${{ github.sha }}"
          else
            echo "$DOCKERHUB_TOKEN" | docker login -u "$USUARIO" --password-stdin
            docker push $USUARIO/$IMAGE_NAME:latest
            docker push $USUARIO/$IMAGE_NAME:${{ github.sha }}
          fi

  deploy-simulado:
    name: Deploy - Simulación
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefacto del build
        uses: actions/download-artifact@v4
        with:
          name: pipeline-django-image
          path: ${{ runner.temp }}/deploy-simulado

      - name: Cargar imagen y levantar servicios
        working-directory: ${{ runner.temp }}/deploy-simulado
        run: |
          gunzip -c $IMAGE_NAME-image.tar.gz | docker load
          docker compose -f docker-compose.deploy.yml up -d

      - name: Validar despliegue
        working-directory: ${{ runner.temp }}/deploy-simulado
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/; then echo; break; fi
            echo "Esperando a la aplicación ($i)..."; sleep 2
          done
          curl -fsS http://localhost:8000/health/ | grep '"status": "ok"'
          curl -fsS http://localhost:8000/ | grep "Lista de tareas"
          docker compose -f docker-compose.deploy.yml ps

      - name: Logs del despliegue
        if: always()
        working-directory: ${{ runner.temp }}/deploy-simulado
        run: docker compose -f docker-compose.deploy.yml logs

      - name: Detener servicios
        if: always()
        working-directory: ${{ runner.temp }}/deploy-simulado
        run: docker compose -f docker-compose.deploy.yml down -v
