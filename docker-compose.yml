# Entorno de desarrollo / validación: construye la imagen desde el código.
#   docker compose up --build
#   http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pipeline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pipeline_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: pipeline-django:latest
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: cambiar-en-produccion
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      POSTGRES_DB: pipeline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
